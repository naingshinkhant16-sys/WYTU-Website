<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - WYTU</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--navy) 0%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .admin-login-card {
      background-color: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="../images/logo.png" alt="WYTU Logo" style="height: 64px; width: auto; margin: 0 auto 1rem auto;">
      <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--navy);">WYTU Admin Portal</h1>
      <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem;">West Yangon Technological University</p>
    </div>

    <div id="admin-login-alert" class="admin-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 1.25rem; font-size: 0.875rem; background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;"></div>

    <form id="admin-login-form">
      <div class="admin-form-group">
        <label for="admin-email-input" class="admin-label">Email *</label>
        <input type="email" id="admin-email-input" class="admin-input" required placeholder="Enter your admin email" autocomplete="username">
      </div>

      <div class="admin-form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label for="admin-password-input" class="admin-label" style="margin-bottom: 0;">Password *</label>
          <button type="button" id="toggle-password-btn" style="background: none; border: none; font-size: 0.8rem; color: var(--primary); cursor: pointer; font-weight: 600;">👁️ Show</button>
        </div>
        <input type="password" id="admin-password-input" class="admin-input" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="admin-form-group" style="display: flex; align-items: center; gap: 0.5rem;">
        <input type="checkbox" id="remember-me" checked style="width: 16px; height: 16px; cursor: pointer;">
        <label for="remember-me" style="font-size: 0.875rem; color: var(--text-muted); cursor: pointer;">Remember me on this device</label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">Login to Dashboard &rarr;</button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; border-top: 1px solid var(--border); padding-top: 1.25rem;">
      <a href="../index.html" style="font-size: 0.875rem; color: var(--text-muted);">&larr; Return to Public Website</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
