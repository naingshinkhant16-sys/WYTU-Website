<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Event - WYTU Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- Admin Top Header -->
  <header class="admin-header">
    <div class="admin-brand">
      <img src="../images/logo.png" alt="WYTU Logo">
      <span>WYTU Admin Management</span>
    </div>
    <div class="admin-user-menu">
      <div class="admin-user-info">
        <span>👤 Logged in as:</span>
        <span class="admin-user-name">Administrator</span>
      </div>
      <button type="button" class="btn-admin-logout">Logout</button>
    </div>
  </header>

  <div class="admin-wrapper">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
      <a href="index.html" class="admin-nav-item">📊 Dashboard</a>
      <a href="events.html" class="admin-nav-item active">📢 Manage Events</a>
      <a href="create-event.html" class="admin-nav-item">➕ Create Event</a>
      <a href="../index.html" class="admin-nav-item" target="_blank">🌐 View Website &rarr;</a>
    </aside>

    <!-- Admin Main Content -->
    <main class="admin-main">
      <div class="admin-page-header">
        <div>
          <h1 class="admin-page-title">Edit Event Announcement</h1>
          <p class="admin-page-subtitle">Update information, event details, or images for this announcement.</p>
        </div>
        <a href="events.html" class="btn btn-outline">&larr; Back to Events</a>
      </div>

      <div id="form-error-alert" style="display: none; padding: 1rem; border-radius: var(--radius); background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; margin-bottom: 1.5rem; font-weight: 600;"></div>

      <div class="admin-card" style="padding: 2.5rem;">
        <form id="admin-edit-event-form">
          <input type="hidden" id="event-id-hidden">

          <div class="admin-form-group">
            <label for="event-title" class="admin-label">Event Title *</label>
            <input type="text" id="event-title" class="admin-input" required>
          </div>

          <div class="grid-2">
            <div class="admin-form-group">
              <label for="event-category" class="admin-label">Category *</label>
              <select id="event-category" class="admin-select" required>
                <option value="Academic & Tech">Academic & Tech</option>
                <option value="Workshop">Workshop</option>
                <option value="Career & Industry">Career & Industry</option>
                <option value="University Event">University Event</option>
                <option value="Sports & Life">Sports & Life</option>
              </select>
            </div>

            <div class="admin-form-group">
              <label for="event-status" class="admin-label">Status *</label>
              <select id="event-status" class="admin-select" required>
                <option value="published">Published (Visible on Public Website)</option>
                <option value="draft">Draft (Visible Only in Admin)</option>
              </select>
            </div>
          </div>

          <div class="grid-3">
            <div class="admin-form-group">
              <label for="event-date" class="admin-label">Event Date *</label>
              <input type="date" id="event-date" class="admin-input" required>
            </div>

            <div class="admin-form-group">
              <label for="event-time" class="admin-label">Time *</label>
              <input type="text" id="event-time" class="admin-input" required>
            </div>

            <div class="admin-form-group">
              <label for="event-location" class="admin-label">Location *</label>
              <input type="text" id="event-location" class="admin-input" required>
            </div>
          </div>

          <div class="admin-form-group">
            <label for="event-description" class="admin-label">Short Description *</label>
            <textarea id="event-description" class="admin-textarea" required style="min-height: 80px;"></textarea>
          </div>

          <div class="admin-form-group">
            <label for="event-full-content" class="admin-label">Full Details & Agenda</label>
            <textarea id="event-full-content" class="admin-textarea" style="min-height: 150px;"></textarea>
          </div>

          <!-- Multi-Image Upload Dropzone -->
          <div class="admin-form-group">
            <label class="admin-label">Manage Event Images (Min 1, Max 3) *</label>
            <div class="upload-dropzone" onclick="document.getElementById('event-images-input').click();">
              <div class="upload-icon">📷</div>
              <div style="font-weight: 700; color: var(--navy); margin-bottom: 0.25rem;">Click to Add/Replace Images</div>
              <div style="font-size: 0.85rem; color: var(--text-muted);">Supports JPG, PNG, WEBP (Max 5MB each)</div>
            </div>
            <input type="file" id="event-images-input" accept="image/png, image/jpeg, image/webp" multiple style="display: none;">

            <div id="image-preview-grid" class="image-preview-grid">
              <!-- Rendered preview thumbnails -->
            </div>
          </div>

          <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <a href="events.html" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Update Announcement &rarr;</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
